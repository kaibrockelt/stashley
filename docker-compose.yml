services:
  stashley:
    image: stashley:local
    build: .
    env_file: .env
    ports:
      - '8080:8080'
    volumes:
      - stashley-data:/data
    restart: unless-stopped
    stop_grace_period: 40s

volumes:
  stashley-data:
